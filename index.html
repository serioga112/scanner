<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arbitrage Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial}
.wrap{max-width:900px;margin:auto;padding:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:#121821;border:1px solid #202a36;border-radius:16px;padding:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin:15px 0}
input,button{height:44px;border-radius:11px}input{width:100%;background:#151b24;border:1px solid #26303d;color:#fff;padding:0 11px}
button{border:0;background:#2563eb;color:#fff;font-weight:800;padding:0 15px}.muted{font-size:12px;color:#8390a0}
.badge{color:#65e6a1;background:#143a2a;border-radius:9px;padding:6px 9px;font-weight:900}
.side{display:grid;grid-template-columns:1fr 65px 100px;gap:7px;padding:8px 0}.right{text-align:right}.stake{color:#65e6a1;font-weight:800}
hr{border:0;border-top:1px solid #232c37}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.side{grid-template-columns:1fr 55px 88px}}
</style>
</head>
<body>
<div class="wrap">
<div class="row">
 <div><h2 style="margin:0">SpinAndBet + Stake</h2><div id="mode" class="muted">CLOUD SCANNER</div></div>
 <button id="auto" onclick="toggleAuto()">Auto: Off</button>
</div>

<div class="grid">
 <div><div class="muted">BANKROLL</div><input id="bank" type="number" value="1000"></div>
 <div><div class="muted">MIN ARB %</div><input id="min" type="number" value="0.5" step="0.1"></div>
 <div><div class="muted">REFRESH SEC</div><input id="secs" type="number" value="15"></div>
 <div class="wide" style="display:flex;align-items:end"><button onclick="load()" style="width:100%">Refresh</button></div>
</div>

<div id="status" class="muted" style="margin-bottom:12px">Ready</div>
<div id="items"></div>
<div class="card muted">Scanner only. No automatic betting. Confirm prices, limits, market rules and settlement rules before acting on any opportunity.</div>
</div>

<script>
let timer=null;
function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
async function load(){
 const bank=document.getElementById("bank").value||1000;
 const min=document.getElementById("min").value||0;
 document.getElementById("status").textContent="Scanning...";
 try{
   const r=await fetch("/api/opportunities?bankroll="+encodeURIComponent(bank)+"&min_arb_percent="+encodeURIComponent(min));
   if(!r.ok) throw Error("HTTP "+r.status);
   const data=await r.json();
   document.getElementById("status").textContent=(data.opportunities||[]).length+" opportunities • "+new Date().toLocaleTimeString();
   render(data.opportunities||[]);
 }catch(e){
   document.getElementById("status").textContent="Connection error: "+e.message;
   document.getElementById("items").innerHTML='<div class="card muted">Could not load scanner data.</div>';
 }
}
function render(items){
 const box=document.getElementById("items");
 if(!items.length){box.innerHTML='<div class="card muted">No qualifying arbitrage found.</div>';return}
 box.innerHTML=items.map(x=>`<div class="card">
 <div class="row"><div><b>${esc(x.event)}</b><div class="muted">${esc(x.league)} • ${esc(x.market)}</div></div><div class="badge">+${Number(x.arbPercent).toFixed(2)}%</div></div>
 <hr>
 <div class="side"><div><b>${esc(x.selectionA)}</b><div class="muted">${esc(x.bookmakerA)}</div></div><div class="right"><b>${Number(x.oddsA).toFixed(2)}</b></div><div class="right stake">$${Number(x.stakeA).toFixed(2)}</div></div>
 <div class="side"><div><b>${esc(x.selectionB)}</b><div class="muted">${esc(x.bookmakerB)}</div></div><div class="right"><b>${Number(x.oddsB).toFixed(2)}</b></div><div class="right stake">$${Number(x.stakeB).toFixed(2)}</div></div>
 <div class="muted">Return: $${Number(x.guaranteedReturn).toFixed(2)} • Profit: $${Number(x.profit).toFixed(2)}</div>
 </div>`).join("")
}
function toggleAuto(){
 const b=document.getElementById("auto");
 if(timer){clearInterval(timer);timer=null;b.textContent="Auto: Off";return}
 const s=Math.max(3,Number(document.getElementById("secs").value)||15);
 timer=setInterval(load,s*1000);b.textContent="Auto: On";load()
}
load();
</script>
</body>
</html>
