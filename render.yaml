services:
  - type: web
    name: spinandbet-stake-arbitrage-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: USE_DEMO_DATA
        value: "true"
      - key: BANKROLL
        value: "1000"
      - key: MIN_ARB_PERCENT
        value: "0.5"
      - key: REQUEST_TIMEOUT
        value: "10"
      - key: STAKE_FEED_URL
        sync: false
      - key: STAKE_AUTH_HEADER
        sync: false
      - key: STAKE_AUTH_VALUE
        sync: false
      - key: SPINANDBET_FEED_URL
        sync: false
      - key: SPINANDBET_AUTH_HEADER
        sync: false
      - key: SPINANDBET_AUTH_VALUE
        sync: false
